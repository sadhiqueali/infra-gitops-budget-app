apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: budget-app
  namespace: argocd
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/sadhiqueali/infra-gitops-budget-app.git
    path: base
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
