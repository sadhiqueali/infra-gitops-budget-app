apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: budget-app
  template:
    metadata:
      labels:
        app: budget-app
    spec:
      containers:
        - name: budget-app
          image: your-dockerhub/budget-app:latest
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              value: "postgres"
            - name: DB_USERNAME
              value: "postgres"
            - name: DB_PASSWORD
              value: "password"
            - name: DB_NAME
              value: "budget_app"
---
apiVersion: v1
kind: Service
metadata:
  name: budget-app-service
spec:
  selector:
    app: budget-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP



